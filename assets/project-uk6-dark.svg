.blink{animation:blink 1.8s steps(1,end) infinite}
.type-window{animation:typing 2.2s steps(11,end) both}
.reveal1{animation:reveal .5s 2.5s both}.reveal2{animation:reveal .5s 3.1s both}.reveal3{animation:reveal .5s 3.7s both}.reveal4{animation:reveal .5s 4.3s both}
.twinkle{animation:twinkle 4s ease-in-out infinite alternate}.twinkle.alt{animation-delay:-2s}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes blink{0%,65%,100%{opacity:1}75%,90%{opacity:.15}}
@keyframes typing{from{width:0}to{width:560px}}
@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.blink,.type-window,.reveal1,.reveal2,.reveal3,.reveal4,.twinkle,.pulse{animation:none!important}.type-window{width:560px}}
