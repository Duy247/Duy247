name: Live profile cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate live cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Duy247
          outputs: |
            assets/generated/snake-dark.svg?palette=github-dark
            assets/generated/snake-light.svg?palette=github-light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/*.svg
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m "chore: refresh live profile assets"
          git push
